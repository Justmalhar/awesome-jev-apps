name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The client is duplicated into each app on purpose; make sure nobody
      # edited a copy instead of the source.
      - name: provider copies are in sync
        run: uv run --no-project python scripts/sync_provider.py --check

      # Indexes are generated from catalog.json + what is on disk, so a
      # stale table can never claim an app exists when it does not.
      - name: catalog indexes are current
        run: uv run --no-project python scripts/build_catalog.py --check

      # Offline self-check: config resolution, question builders, answer parsing,
      # cost maths. Needs no API key, so it runs on forks.
      - name: provider self-check
        run: uv run --no-project --with httpx python _shared/jev_provider.py

      - name: everything compiles
        run: uv run --no-project python -m compileall -q 00-primitives apps scripts _shared

      # Question construction, decision rules, chunking, batching, and the
      # guard against asking the model to do arithmetic. Still no key needed.
      - name: offline app checks
        run: >
          uv run --no-project --with httpx --with streamlit --with pandas
          --with scikit-learn python scripts/test_apps.py
