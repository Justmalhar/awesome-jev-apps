[project]
name = "ml-features"
version = "0.1.0"
description = "Free text into calibrated features, a trained sklearn model, and the measured AUC lift over a text-free baseline."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]
